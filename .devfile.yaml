schemaVersion: 2.2.0
metadata:
  name: rhoai-devspaces-continue
  displayName: RHOAI Dev Spaces with Continue
  description: Dev Spaces workspace that bootstraps Continue and GPT endpoint config.
components:
  - name: tools
    container:
      image: registry.redhat.io/devspaces/udi-rhel9
      mountSources: true
      sourceMapping: /projects
      memoryLimit: 4Gi
      cpuLimit: "2"
commands:
  - id: install-vscode-extensions
    exec:
      component: tools
      commandLine: |
        BIN="$(command -v code || command -v che-code || true)"
        if [ -z "$BIN" ]; then
          echo "code/che-code binary not found; skipping extension install"
          exit 0
        fi
        "$BIN" --install-extension Continue.continue --force || true
        "$BIN" --install-extension ms-python.python --force || true
        "$BIN" --install-extension ms-toolsai.jupyter --force || true
        "$BIN" --install-extension redhat.ansible --force || true
        "$BIN" --install-extension redhat.vscode-yaml --force || true
        "$BIN" --install-extension yzhang.markdown-all-in-one --force || true
        "$BIN" --install-extension ms-vscode.live-server --force || true
        "$BIN" --install-extension ms-azuretools.vscode-containers --force || true
        "$BIN" --install-extension redhat.vscode-podman --force || true
      workingDir: /projects

  - id: write-continue-config-gpt
    exec:
      component: tools
      commandLine: |
        mkdir -p "${HOME}/.continue"
        printf '%s\n' \
          'name: Local Assistant' \
          'version: 1.0.0' \
          'schema: v1' \
          'models:' \
          '  - name: gpt-oss-20b' \
          '    provider: openai' \
          '    model: "gpt-oss-20b"' \
          '    apiBase: "http://gpt-oss-20b-predictor.canberra.svc.cluster.local:8080/v1"' \
          '    apiKey: "dummy"' \
          'context:' \
          '  - provider: code' \
          '  - provider: docs' \
          '  - provider: diff' \
          '  - provider: terminal' \
          '  - provider: problems' \
          '  - provider: folder' \
          '  - provider: codebase' \
          > "${HOME}/.continue/config.yaml"
      workingDir: /projects

events:
  postStart:
    - install-vscode-extensions
    - write-continue-config-gpt
