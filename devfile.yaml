schemaVersion: 2.2.0
metadata:
  name: rhoai-devspaces-continue
  displayName: RHOAI Dev Spaces with Continue
  description: Dev Spaces workspace that bootstraps Continue and GPT endpoint config.
components:
  - name: tools
    container:
      image: registry.redhat.io/devspaces/udi-rhel9
      mountSources: true
      sourceMapping: /projects
      memoryLimit: 4Gi
      cpuLimit: "2"
commands:
  - id: write-workspace-config
    exec:
      component: tools
      commandLine: |
        mkdir -p /projects/.vscode /projects/.continue
        cat > /projects/.vscode/extensions.json <<'EOF'
        {
          "recommendations": [
            "Continue.continue",
            "ms-python.python",
            "ms-toolsai.jupyter",
            "redhat.ansible",
            "redhat.vscode-yaml",
            "yzhang.markdown-all-in-one",
            "ms-vscode.live-server",
            "ms-azuretools.vscode-containers",
            "redhat.vscode-podman"
          ]
        }
        EOF
        printf '%s\n' \
          'name: Local Assistant' \
          'version: 1.0.0' \
          'schema: v1' \
          'models:' \
          '  - name: gpt-oss-20b' \
          '    provider: openai' \
          '    model: "gpt-oss-20b"' \
          '    apiBase: "http://gpt-oss-20b-predictor.canberra.svc.cluster.local:8080/v1"' \
          '    apiKey: "dummy"' \
          'context:' \
          '  - provider: code' \
          '  - provider: docs' \
          '  - provider: diff' \
          '  - provider: terminal' \
          '  - provider: problems' \
          '  - provider: folder' \
          '  - provider: codebase' \
          > ~/.continue/config.yaml
      workingDir: /projects

events:
  postStart:
    - write-workspace-config
